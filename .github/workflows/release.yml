name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a GitHub Release with the built APKs"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platforms
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Verify APK architecture and manifest
        id: verify
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2=$(find "$SDK/build-tools" -name aapt2 | sort | tail -1)
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner | sort | tail -1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)

          {
            echo "### Pagwyn release verification"
            echo
            echo "| Artifact | Size |"
            echo "|---|---|"
            echo "| debug | $(du -h "$DEBUG_APK" | cut -f1) ($(stat -c%s "$DEBUG_APK") bytes) |"
            echo "| release | $(du -h "$RELEASE_APK" | cut -f1) ($(stat -c%s "$RELEASE_APK") bytes) |"
            echo
            echo "**ABIs present in the release APK**"
            echo '```'
            unzip -l "$RELEASE_APK" | grep -E '^ *[0-9]+ .*lib/' || echo "(no native libraries — Pagwyn is pure Kotlin/Java)"
            echo '```'
            echo
            echo "**minSdk / targetSdk**"
            echo '```'
            "$AAPT2" dump badging "$RELEASE_APK" | grep -E "sdkVersion|targetSdkVersion|package:|launchable-activity" || true
            echo '```'
            echo
            echo "**Declared permissions**"
            echo '```'
            "$AAPT2" dump permissions "$RELEASE_APK" || true
            echo '```'
            echo
            echo "**Signature**"
            echo '```'
            "$APKSIGNER" verify --print-certs "$RELEASE_APK" | head -5 || true
            echo '```'
          } | tee /tmp/report.md

          cp "$RELEASE_APK" "pagwyn-release.apk"
          cp "$DEBUG_APK" "pagwyn-debug.apk"

      - name: Publish verification report
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          body = json.loads(json.dumps({"body": open('/tmp/report.md').read()}))
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/commits/{os.environ['SHA']}/comments",
              data=json.dumps(body).encode(),
              headers={
                  "Authorization": f"token {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(req).read()
          PY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pagwyn-apks
          path: |
            pagwyn-release.apk
            pagwyn-debug.apk
            app/build/outputs/apk/release/output-metadata.json
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Pagwyn build' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          files: |
            pagwyn-release.apk
            pagwyn-debug.apk
          body: |
            ## Pagwyn — Read Without Distraction

            Lightweight, offline-first PDF reader for Android 7.0+.

            * **pagwyn-release.apk** — minified, resource-shrunk build for everyday use.
            * **pagwyn-debug.apk** — unminified build with LeakCanary, for testing.

            Both APKs are universal: they install on 32-bit ARMv7 and 64-bit ARM
            devices as well as x86/x86_64 emulators. Pagwyn contains no native
            libraries, so ARMv7 support is guaranteed by construction.

            The release APK is signed with the project's development key, which is
            intentional for sideloading. Reproducible builds are described in
            `docs/BUILDING.md`.
