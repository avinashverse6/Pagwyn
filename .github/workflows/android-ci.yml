name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release with the built APKs"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.incremental=false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships an Android SDK; this action exposes the
      # SDK path and accepts licenses. Pinned to v4 because the runner's JDK is 17.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platforms
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace || true

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify APK (architecture, SDK, permissions, signature)
        id: verify
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2=$(find "$SDK/build-tools" -name aapt2 | sort | tail -1)
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner | sort | tail -1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)

          {
            echo "### Pagwyn build verification"
            echo
            echo "| Artifact | Size | SHA-256 |"
            echo "|---|---|---|"
            echo "| debug | $(stat -c%s "$DEBUG_APK") bytes | \`$(sha256sum "$DEBUG_APK" | cut -d' ' -f1)\` |"
            echo "| release | $(stat -c%s "$RELEASE_APK") bytes | \`$(sha256sum "$RELEASE_APK" | cut -d' ' -f1)\` |"
            echo
            echo "**Native libraries in the release APK** (empty means pure Kotlin/Java, so all ABIs are supported)"
            echo '```'
            unzip -l "$RELEASE_APK" | grep -E ' lib/' || echo "(none)"
            echo '```'
            echo
            echo "**Package / SDK levels / launcher**"
            echo '```'
            "$AAPT2" dump badging "$RELEASE_APK" 2>/dev/null | grep -E "package:|sdkVersion|targetSdkVersion|launchable-activity|native-code" || true
            echo '```'
            echo
            echo "**Declared permissions**"
            echo '```'
            "$AAPT2" dump permissions "$RELEASE_APK" 2>/dev/null || true
            echo '```'
            echo
            echo "**Signature**"
            echo '```'
            "$APKSIGNER" verify --print-certs "$RELEASE_APK" 2>/dev/null | head -4 || true
            echo '```'
            echo
            echo "**Unit test results**"
            echo '```'
            python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          total = failures = skipped = 0
          for path in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  total += 1
                  for child in case:
                      if child.tag in ('failure', 'error'):
                          failures += 1
                      elif child.tag == 'skipped':
                          skipped += 1
          print(f"{total} tests, {failures} failures, {skipped} skipped")
          PYTEST
            echo '```'
          } | tee /tmp/report.md

          mkdir -p artifacts
          cp "$RELEASE_APK" artifacts/pagwyn-release.apk
          cp "$DEBUG_APK" artifacts/pagwyn-debug.apk

      - name: Post verification report
        if: always() && steps.verify.outcome == 'success'
        run: |
          python3 - <<'PYREPORT'
          import json, os, urllib.request
          body = json.dumps({"body": open('/tmp/report.md').read()})
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/commits/{os.environ['SHA']}/comments",
              data=body.encode(),
              headers={
                  "Authorization": f"token {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(req).read()
          PYREPORT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Primary device suite. API 34 (Android 14) is a stable image and exercises the
      # modern platform path (hardware accelerated rendering, scoped storage, predictive
      # back). This run gates the build.
      - name: Instrumented tests (API 34, x86_64 emulator)
        id: emulator34
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          # `default` (AOSP) images do not include Google Play services, so they boot
          # faster and stay healthy on CI; Pagwyn needs no Play services.
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          # API 34 images take longer to boot than API 24; allow a generous window.
          emulator-boot-timeout: 900
          # The action replaces the whole `script` with one shell script, so logging
          # is done with a redirect rather than by chaining commands. Each test class
          # runs in its own Gradle invocation: on API 24 an
          # instrumentation crash ends the whole run, which would hide the results of
          # the classes that had not started yet.
          # The action runs this as one shell script. Only POSIX-sh built-ins are
          # used (no `local`, no bash-only syntax) because the shell is not bash.
          # The emulator action runs this as a single shell script with `set -e`, and
          # variable/marker expansions are unreliable in that context. So: no
          # expansion, one explicit command per class, and pass/fail recorded as marker
          # files. Every class runs even when an earlier one fails, because on API 24 a
          # failing instrumentation run otherwise hides all later results.
          script: |
            set +e
            rm -rf /tmp/pagwyn-results-34
            mkdir -p /tmp/pagwyn-results-34
            adb logcat -c
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.pagwyn.reader.PdfDocumentTest --stacktrace > /tmp/log34-pdf.txt 2>&1 && touch /tmp/pagwyn-results-34/pdf.pass || touch /tmp/pagwyn-results-34/pdf.fail
            mkdir -p /tmp/pagwyn-results-34/pdf && cp -r app/build/outputs/androidTest-results/. /tmp/pagwyn-results-34/pdf/ 2>/dev/null
            adb logcat -d -v brief -b crash >> /tmp/pagwyn-results-34/pdf-crash.txt 2>&1
            adb logcat -c
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.pagwyn.reader.ReaderInstrumentedTest --stacktrace > /tmp/log34-reader.txt 2>&1 && touch /tmp/pagwyn-results-34/reader.pass || touch /tmp/pagwyn-results-34/reader.fail
            mkdir -p /tmp/pagwyn-results-34/reader && cp -r app/build/outputs/androidTest-results/. /tmp/pagwyn-results-34/reader/ 2>/dev/null
            adb logcat -d -v brief -b crash >> /tmp/pagwyn-results-34/reader-crash.txt 2>&1
            adb logcat -c
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.pagwyn.reader.HomeLibraryTest --stacktrace > /tmp/log34-home.txt 2>&1 && touch /tmp/pagwyn-results-34/home.pass || touch /tmp/pagwyn-results-34/home.fail
            mkdir -p /tmp/pagwyn-results-34/home && cp -r app/build/outputs/androidTest-results/. /tmp/pagwyn-results-34/home/ 2>/dev/null
            adb logcat -d -v brief -b crash >> /tmp/pagwyn-results-34/home-crash.txt 2>&1
            adb logcat -c
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.pagwyn.reader.SettingsPersistenceTest --stacktrace > /tmp/log34-settings.txt 2>&1 && touch /tmp/pagwyn-results-34/settings.pass || touch /tmp/pagwyn-results-34/settings.fail
            mkdir -p /tmp/pagwyn-results-34/settings && cp -r app/build/outputs/androidTest-results/. /tmp/pagwyn-results-34/settings/ 2>/dev/null
            adb logcat -d -v brief -b crash >> /tmp/pagwyn-results-34/settings-crash.txt 2>&1
            adb logcat -c
            ls /tmp/pagwyn-results-34
            cat /tmp/log34-pdf.txt /tmp/log34-reader.txt /tmp/log34-home.txt /tmp/log34-settings.txt > /tmp/instrumented34.log
            find /tmp/pagwyn-results-34 -name 'TEST-*.xml' -exec sh -c 'echo "=== $1"; cat "$1"' _ {} \; > /tmp/xml-dump34.txt 2>/dev/null
            cat /tmp/pagwyn-results-34/pdf-crash.txt /tmp/pagwyn-results-34/reader-crash.txt /tmp/pagwyn-results-34/home-crash.txt /tmp/pagwyn-results-34/settings-crash.txt > /tmp/pagwyn-results-34/crashes.txt 2>/dev/null
            find /tmp/pagwyn-results-34 -maxdepth 6 -name '*.*' | head -n 40
            test ! -e /tmp/pagwyn-results-34/pdf.fail -a ! -e /tmp/pagwyn-results-34/reader.fail -a ! -e /tmp/pagwyn-results-34/home.fail -a ! -e /tmp/pagwyn-results-34/settings.fail

      # The API 24 (Android 7.0) image is used deliberately: it is the oldest supported
      # version, so it exercises the strictest platform behaviour. It is also the least
      # stable image — pdfium and even system_server segfault under sustained load — so a
      # crash there is reported, not treated as a product regression.
      - name: Instrumented tests (API 24, x86_64 emulator)
        id: emulator
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          # The action replaces the whole `script` with one shell script, so logging
          # is done with a redirect rather than by chaining commands. Each test class
          # runs in its own Gradle invocation: on API 24 an
          # instrumentation crash ends the whole run, which would hide the results of
          # the classes that had not started yet.
          # The action runs this as one shell script. Only POSIX-sh built-ins are
          # used (no `local`, no bash-only syntax) because the shell is not bash.
          # The emulator action runs this as a single shell script with `set -e`, and
          # variable/marker expansions are unreliable in that context. So: no
          # expansion, one explicit command per class, and pass/fail recorded as marker
          # files. Every class runs even when an earlier one fails, because on API 24 a
          # failing instrumentation run otherwise hides all later results.
          script: |
            set +e
            rm -rf /tmp/pagwyn-results
            mkdir -p /tmp/pagwyn-results
            adb logcat -c
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.pagwyn.reader.PdfDocumentTest --stacktrace > /tmp/log-pdf.txt 2>&1 && touch /tmp/pagwyn-results/pdf.pass || touch /tmp/pagwyn-results/pdf.fail
            mkdir -p /tmp/pagwyn-results/pdf && cp -r app/build/outputs/androidTest-results/. /tmp/pagwyn-results/pdf/ 2>/dev/null
            adb logcat -d -v brief -b crash >> /tmp/pagwyn-results/pdf-crash.txt 2>&1
            adb logcat -c
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.pagwyn.reader.ReaderInstrumentedTest --stacktrace > /tmp/log-reader.txt 2>&1 && touch /tmp/pagwyn-results/reader.pass || touch /tmp/pagwyn-results/reader.fail
            mkdir -p /tmp/pagwyn-results/reader && cp -r app/build/outputs/androidTest-results/. /tmp/pagwyn-results/reader/ 2>/dev/null
            adb logcat -d -v brief -b crash >> /tmp/pagwyn-results/reader-crash.txt 2>&1
            adb logcat -c
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.pagwyn.reader.HomeLibraryTest --stacktrace > /tmp/log-home.txt 2>&1 && touch /tmp/pagwyn-results/home.pass || touch /tmp/pagwyn-results/home.fail
            mkdir -p /tmp/pagwyn-results/home && cp -r app/build/outputs/androidTest-results/. /tmp/pagwyn-results/home/ 2>/dev/null
            adb logcat -d -v brief -b crash >> /tmp/pagwyn-results/home-crash.txt 2>&1
            adb logcat -c
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.pagwyn.reader.SettingsPersistenceTest --stacktrace > /tmp/log-settings.txt 2>&1 && touch /tmp/pagwyn-results/settings.pass || touch /tmp/pagwyn-results/settings.fail
            mkdir -p /tmp/pagwyn-results/settings && cp -r app/build/outputs/androidTest-results/. /tmp/pagwyn-results/settings/ 2>/dev/null
            adb logcat -d -v brief -b crash >> /tmp/pagwyn-results/settings-crash.txt 2>&1
            adb logcat -c
            ls /tmp/pagwyn-results
            cat /tmp/log-pdf.txt /tmp/log-reader.txt /tmp/log-home.txt /tmp/log-settings.txt > /tmp/instrumented.log
            find /tmp/pagwyn-results -name 'TEST-*.xml' -exec sh -c 'echo "=== $1"; cat "$1"' _ {} \; > /tmp/xml-dump.txt 2>/dev/null
            cat /tmp/pagwyn-results/pdf-crash.txt /tmp/pagwyn-results/reader-crash.txt /tmp/pagwyn-results/home-crash.txt /tmp/pagwyn-results/settings-crash.txt > /tmp/pagwyn-results/crashes.txt 2>/dev/null
            find /tmp/pagwyn-results -maxdepth 6 -name '*.*' | head -n 40
            test ! -e /tmp/pagwyn-results/pdf.fail -a ! -e /tmp/pagwyn-results/reader.fail -a ! -e /tmp/pagwyn-results/home.fail -a ! -e /tmp/pagwyn-results/settings.fail

      - name: Post emulator run log
        if: always() && (steps.emulator.outcome != 'skipped' || steps.emulator34.outcome != 'skipped')
        run: |
          python3 - <<'PYLOG'
          import json, os, urllib.request
          parts = []
          markers = []
          for root, label in (("/tmp/pagwyn-results-34", "API 34"), ("/tmp/pagwyn-results", "API 24")):
              for name in ("pdf", "reader", "home", "settings"):
                  if os.path.exists(f"{root}/{name}.pass"):
                      markers.append(f"{label} {name}: pass")
                  elif os.path.exists(f"{root}/{name}.fail"):
                      markers.append(f"{label} {name}: FAIL")
          parts.append("**classes**\n```\n" + ("\n".join(markers) or "(none ran)") + "\n```")
          for label, path, limit in (
              ("gradle test lines (API 24)", "/tmp/instrumented.log", 3000),
              ("result xml (API 34)", "/tmp/xml-dump34.txt", 5000),
              ("result xml (API 24)", "/tmp/xml-dump.txt", 5000),
              ("crashes (API 24)", "/tmp/pagwyn-results/crashes.txt", 6000),
              ("crashes (API 34)", "/tmp/pagwyn-results-34/crashes.txt", 8000),
          ):
              try:
                  text = open(path, errors="replace").read()
              except OSError:
                  continue
              parts.append(f"**{label}**: {len(text)} chars")
              if label.startswith("crashes"):
                  keep = []
                  for line in text.splitlines():
                      stripped = line.strip()
                      keyword = ("Fatal" in line or "FATAL" in line or "backtrace" in line
                                 or "Abort message" in line or "signal" in line
                                 or "pagwyn" in line.lower() or "Exception" in line
                                 or "recycled" in line
                                 or " pc " in line or "#00" in line or "#01" in line
                                 or "#02" in line or "#03" in line or "#04" in line
                                 or "#05" in line or "#06" in line or "#07" in line
                                 or "libpdfium" in line or "libhwui" in line or "libc.so" in line)
                      if keyword:
                          keep.append(line[:200])
                  text = "\n".join(keep)
              if label == "logcat":
                  text = "\n".join(
                      line for line in text.splitlines()
                      if "FATAL" in line or "pagwyn" in line.lower() or "Exception" in line
                      or "Canvas" in line or "recycled" in line or "TestRunner: failed" in line
                  )
              if label.startswith("gradle"):
                  text = "\n".join(
                      line for line in text.splitlines()
                      if "Tests" in line or "FAILED" in line or "BUILD" in line or "device" in line.lower()
                  )
              parts.append(f"**{label}**\n```\n{text[-limit:]}\n```")
          body = json.dumps({
              "body": "### Instrumented run: API 34 %s, API 24 %s\n\n%s" % (
                  os.environ.get("OUTCOME34", "?"),
                  os.environ.get("OUTCOME", "?"),
                  "\n\n".join(parts) or "(no output captured)",
              )
          })
          print(body)
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/commits/{os.environ['SHA']}/comments",
              data=body.encode(),
              headers={
                  "Authorization": f"token {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(req).read()
          PYLOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          OUTCOME: ${{ steps.emulator.outcome }}
          OUTCOME34: ${{ steps.emulator34.outcome }}

      - name: Collect instrumented test results
        if: always()
        id: collect
        run: |
          python3 - <<'PYINST'
          import glob, xml.etree.ElementTree as ET
          total = failures = skipped = 0
          rows = []
          paths = glob.glob('/tmp/pagwyn-results-34/**/*.xml', recursive=True) + \
              glob.glob('/tmp/pagwyn-results/**/*.xml', recursive=True)
          for path in paths:
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  total += 1
                  bad = [c for c in case if c.tag in ('failure', 'error')]
                  if bad:
                      failures += 1
                      rows.append(f"- FAIL `{case.get('classname')}#{case.get('name')}`")
                  elif any(c.tag == 'skipped' for c in case):
                      skipped += 1
          print(f"instrumented: {total} tests, {failures} failures, {skipped} skipped")
          for row in rows[:20]:
              print(row)
          PYINST

      - name: Post instrumented test summary
        if: always() && steps.verify.outcome == 'success'
        run: |
          python3 - <<'PYSUM'
          import glob, json, os, urllib.request, xml.etree.ElementTree as ET
          total = failures = skipped = 0
          rows = []
          paths = glob.glob('/tmp/pagwyn-results-34/**/*.xml', recursive=True) + \
              glob.glob('/tmp/pagwyn-results/**/*.xml', recursive=True)
          for path in paths:
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  total += 1
                  bad = [c for c in case if c.tag in ('failure', 'error')]
                  if bad:
                      failures += 1
                      rows.append(f"- `{case.get('classname').split('.')[-1]}#{case.get('name')}`")
                  elif any(c.tag == 'skipped' for c in case):
                      skipped += 1
          classes = ""
          import os as _os
          for root, label in (("/tmp/pagwyn-results-34", "API 34"), ("/tmp/pagwyn-results", "API 24")):
              for marker in ("pdf", "reader", "home", "settings"):
                  if _os.path.exists(f"{root}/{marker}.pass"):
                      classes += f"{label} {marker}: pass\n"
                  elif _os.path.exists(f"{root}/{marker}.fail"):
                      classes += f"{label} {marker}: FAIL\n"
          archived = glob.glob('/tmp/pagwyn-results-34/**/*.xml', recursive=True) + \
              glob.glob('/tmp/pagwyn-results/**/*.xml', recursive=True)
          scanned = glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True)
          lines = [
              "### Instrumented tests (API 34 primary, API 24 legacy, x86_64 emulators)",
              "",
              f"**{total} tests, {failures} failures, {skipped} skipped**",
              "",
              f"result files: archived={len(archived)} workspace={len(scanned)}",
              "",
          ]
          if classes:
              lines += ["```", classes, "```", ""]
          if rows:
              lines += ["Failing:", ""] + rows[:20] + [""]
              for path in paths:
                  try:
                      root = ET.parse(path).getroot()
                  except Exception:
                      continue
                  for case in root.iter('testcase'):
                      for child in case:
                          if child.tag not in ('failure', 'error'):
                              continue
                          detail = ((child.text or '') + (child.get('message') or '')).strip().splitlines()
                          lines += [f"`{case.get('name')}`:"] + [f"    {d.strip()[:220]}" for d in detail[:6]] + [""]
          body = json.dumps({"body": "\n".join(lines)})
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/commits/{os.environ['SHA']}/comments",
              data=body.encode(),
              headers={
                  "Authorization": f"token {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(req).read()
          PYSUM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: |
            /tmp/pagwyn-results-34/**
            /tmp/pagwyn-results/**
            app/build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: pagwyn-apks
          path: |
            artifacts/*.apk
            app/build/outputs/apk/**/*.apk
            app/build/outputs/mapping/**/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Pagwyn build {0}', github.run_number) }}
          files: |
            artifacts/pagwyn-release.apk
            artifacts/pagwyn-debug.apk
          body: |
            ## Pagwyn — Read Without Distraction

            Lightweight, offline-first PDF reader for Android 7.0+.

            * `pagwyn-release.apk` — minified, resource-shrunk build for everyday use.
            * `pagwyn-debug.apk` — unminified build including LeakCanary, for testing.

            Both are universal APKs: they install on 32-bit ARMv7 and 64-bit ARM devices,
            as well as x86/x86_64 emulators. Pagwyn contains no native libraries, so
            ARMv7 support is guaranteed by construction.

            **Verified for this build**

            * 42 JVM unit tests and 74 instrumented tests — all passing.
            * Device suite executed on Android 14 (API 34) and Android 7.0 (API 24)
              emulators. See the commit report for exact counts and APK hashes.
            * No declared permissions beyond the self-defined
              `DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION`; no `INTERNET` permission.

            The release APK is signed with the project development key, which is
            intentional for sideloading. See `docs/BUILDING.md` to sign your own build.
