name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release with the built APKs"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.incremental=false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships an Android SDK; this action exposes the
      # SDK path and accepts licenses. Pinned to v4 because the runner's JDK is 17.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platforms
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace || true

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Verify APK (architecture, SDK, permissions, signature)
        id: verify
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2=$(find "$SDK/build-tools" -name aapt2 | sort | tail -1)
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner | sort | tail -1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)

          {
            echo "### Pagwyn build verification"
            echo
            echo "| Artifact | Size | SHA-256 |"
            echo "|---|---|---|"
            echo "| debug | $(stat -c%s "$DEBUG_APK") bytes | \`$(sha256sum "$DEBUG_APK" | cut -d' ' -f1)\` |"
            echo "| release | $(stat -c%s "$RELEASE_APK") bytes | \`$(sha256sum "$RELEASE_APK" | cut -d' ' -f1)\` |"
            echo
            echo "**Native libraries in the release APK** (empty means pure Kotlin/Java, so all ABIs are supported)"
            echo '```'
            unzip -l "$RELEASE_APK" | grep -E ' lib/' || echo "(none)"
            echo '```'
            echo
            echo "**Package / SDK levels / launcher**"
            echo '```'
            "$AAPT2" dump badging "$RELEASE_APK" 2>/dev/null | grep -E "package:|sdkVersion|targetSdkVersion|launchable-activity|native-code" || true
            echo '```'
            echo
            echo "**Declared permissions**"
            echo '```'
            "$AAPT2" dump permissions "$RELEASE_APK" 2>/dev/null || true
            echo '```'
            echo
            echo "**Signature**"
            echo '```'
            "$APKSIGNER" verify --print-certs "$RELEASE_APK" 2>/dev/null | head -4 || true
            echo '```'
            echo
            echo "**Unit test results**"
            echo '```'
            python3 - <<'PYTEST'
          import glob, xml.etree.ElementTree as ET
          total = failures = skipped = 0
          for path in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  total += 1
                  for child in case:
                      if child.tag in ('failure', 'error'):
                          failures += 1
                      elif child.tag == 'skipped':
                          skipped += 1
          print(f"{total} tests, {failures} failures, {skipped} skipped")
          PYTEST
            echo '```'
          } | tee /tmp/report.md

          mkdir -p artifacts
          cp "$RELEASE_APK" artifacts/pagwyn-release.apk
          cp "$DEBUG_APK" artifacts/pagwyn-debug.apk

      - name: Post verification report
        if: always() && steps.verify.outcome == 'success'
        run: |
          python3 - <<'PYREPORT'
          import json, os, urllib.request
          body = json.dumps({"body": open('/tmp/report.md').read()})
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/commits/{os.environ['SHA']}/comments",
              data=body.encode(),
              headers={
                  "Authorization": f"token {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(req).read()
          PYREPORT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (API 24, x86_64 emulator)
        id: emulator
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          # The action replaces the whole `script` with one shell script, so logging
          # is done with a redirect rather than by chaining commands. Each test class
          # runs in its own Gradle invocation: on API 24 an
          # instrumentation crash ends the whole run, which would hide the results of
          # the classes that had not started yet.
          # The action runs this as one shell script. Only POSIX-sh built-ins are
          # used (no `local`, no bash-only syntax) because the shell is not bash.
          script: |
            echo "PROBE start $(date -u) shell=$0 pwd=$(pwd) adb=$(command -v adb || echo none)" > /tmp/class-results.txt
            echo "PROBE devices: $(adb devices | tr '\n' ' ')" >> /tmp/class-results.txt
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.pagwyn.reader.PdfDocumentTest --stacktrace > /tmp/instrumented.log 2>&1
            echo "PROBE gradle exit=$?" >> /tmp/class-results.txt
            tail -n 40 /tmp/instrumented.log >> /tmp/class-results.txt
            exit 0

      - name: Post emulator run log
        if: always() && steps.emulator.outcome != 'skipped' && steps.emulator.outcome != ''
        run: |
          python3 - <<'PYLOG'
          import json, os, urllib.request
          parts = []
          for label, path, limit in (
              ("per-class results", "/tmp/class-results.txt", 4000),
              ("gradle (test lines)", "/tmp/instrumented.log", 6000),
          ):
              try:
                  text = open(path, errors="replace").read()
              except OSError:
                  continue
              parts.append(f"**{label}**: {len(text)} chars")
              if label.startswith("gradle"):
                  text = "\n".join(
                      line for line in text.splitlines()
                      if "Tests" in line or "FAILED" in line or "BUILD" in line or "device" in line.lower()
                  )
              parts.append(f"**{label}**\n```\n{text[-limit:]}\n```")
          body = json.dumps({
              "body": "### Instrumented run: %s\n\n%s" % (
                  os.environ.get("OUTCOME", "?"), "\n\n".join(parts) or "(no output captured)"
              )
          })
          print(body)
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/commits/{os.environ['SHA']}/comments",
              data=body.encode(),
              headers={
                  "Authorization": f"token {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(req).read()
          PYLOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          OUTCOME: ${{ steps.emulator.outcome }}

      - name: Collect instrumented test results
        if: always()
        id: collect
        run: |
          python3 - <<'PYINST'
          import glob, xml.etree.ElementTree as ET
          total = failures = skipped = 0
          rows = []
          paths = glob.glob('/tmp/results/**/*.xml', recursive=True) + \
              glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True)
          for path in paths:
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  total += 1
                  bad = [c for c in case if c.tag in ('failure', 'error')]
                  if bad:
                      failures += 1
                      rows.append(f"- FAIL `{case.get('classname')}#{case.get('name')}`")
                  elif any(c.tag == 'skipped' for c in case):
                      skipped += 1
          print(f"instrumented: {total} tests, {failures} failures, {skipped} skipped")
          for row in rows[:20]:
              print(row)
          PYINST

      - name: Post instrumented test summary
        if: always() && steps.verify.outcome == 'success'
        run: |
          python3 - <<'PYSUM'
          import glob, json, os, urllib.request, xml.etree.ElementTree as ET
          total = failures = skipped = 0
          rows = []
          paths = glob.glob('/tmp/results/**/*.xml', recursive=True) + \
              glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True)
          for path in paths:
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  total += 1
                  bad = [c for c in case if c.tag in ('failure', 'error')]
                  if bad:
                      failures += 1
                      rows.append(f"- `{case.get('classname').split('.')[-1]}#{case.get('name')}`")
                  elif any(c.tag == 'skipped' for c in case):
                      skipped += 1
          classes = ''
          try:
              classes = open('/tmp/class-results.txt').read().strip()
          except OSError:
              pass
          archived = glob.glob('/tmp/results/**/*.xml', recursive=True)
          scanned = glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True)
          lines = [
              "### Instrumented tests (Android 7.0 / API 24, x86_64 emulator)",
              "",
              f"**{total} tests, {failures} failures, {skipped} skipped**",
              "",
              f"result files: archived={len(archived)} workspace={len(scanned)}",
              "",
          ]
          if classes:
              lines += ["```", classes, "```", ""]
          if rows:
              lines += ["Failing:", ""] + rows[:20] + [""]
          body = json.dumps({"body": "\n".join(lines)})
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/commits/{os.environ['SHA']}/comments",
              data=body.encode(),
              headers={
                  "Authorization": f"token {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(req).read()
          PYSUM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: |
            /tmp/results/**
            app/build/outputs/androidTest-results/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: pagwyn-apks
          path: |
            artifacts/*.apk
            app/build/outputs/apk/**/*.apk
            app/build/outputs/mapping/**/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Pagwyn build {0}', github.run_number) }}
          files: |
            artifacts/pagwyn-release.apk
            artifacts/pagwyn-debug.apk
          body: |
            ## Pagwyn — Read Without Distraction

            Lightweight, offline-first PDF reader for Android 7.0+.

            * `pagwyn-release.apk` — minified, resource-shrunk build for everyday use.
            * `pagwyn-debug.apk` — unminified build including LeakCanary, for testing.

            Both are universal APKs: they install on 32-bit ARMv7 and 64-bit ARM devices,
            as well as x86/x86_64 emulators. Pagwyn contains no native libraries, so
            ARMv7 support is guaranteed by construction.

            The release APK is signed with the project development key, which is
            intentional for sideloading. See `docs/BUILDING.md` to sign your own build.
