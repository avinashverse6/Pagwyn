name: Debug build (temporary)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.incremental=false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and capture log
        id: build
        continue-on-error: true
        run: |
          set +e
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace > /tmp/build.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          grep -nE "^e: |error:|FAILURE|What went wrong|Execution failed|Caused by|warning: |^> " /tmp/build.log | head -120 > /tmp/errors.txt
          tail -n 60 /tmp/build.log >> /tmp/errors.txt
      - name: Publish log as commit comment
        if: always()
        run: |
          BODY=$(python3 - <<'PY'
          import json
          try:
              text = open('/tmp/errors.txt', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              text = 'no errors captured'
          print(json.dumps({'body': '### Build diagnostics\n```\n' + text[-60000:] + '\n```'}))
          PY
          )
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d "$BODY" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" > /dev/null
